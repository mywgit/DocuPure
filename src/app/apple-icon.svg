<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#450a0a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Main PDF Sheet with Folded Corner -->
  <g filter="url(#dropShadow)">
    <!-- Sheet Body -->
    <path d="M 148 108 L 308 108 L 388 188 L 388 404 C 388 417.2 377.2 428 364 428 L 148 428 C 134.8 428 124 417.2 124 404 L 124 132 C 124 118.8 134.8 108 148 108 Z" fill="url(#sheetGrad)" />
    
    <!-- Folded Corner Flap -->
    <path d="M 308 108 L 308 180 C 308 184.4 311.6 188 316 188 L 388 188 Z" fill="url(#foldGrad)" />
  </g>

  <!-- PDF Document Content Lines -->
  <!-- Top Red Accent Bar / Tag -->
  <rect x="164" y="164" width="100" height="24" rx="8" fill="#ef4444" />
  
  <!-- Text lines -->
  <rect x="164" y="216" width="184" height="18" rx="6" fill="#cbd5e1" />
  <rect x="164" y="252" width="184" height="18" rx="6" fill="#cbd5e1" />
  <rect x="164" y="288" width="130" height="18" rx="6" fill="#cbd5e1" />

  <!-- Pure Security Shield Badge on bottom-right of sheet -->
  <g transform="translate(268, 296)">
    <circle cx="56" cy="56" r="54" fill="#0f172a" stroke="#ef4444" stroke-width="6" />
    <!-- Lock / Lightning / Sparkle Icon -->
    <path d="M 56 32 C 43 32 38 41 38 48 L 38 56 L 34 56 C 31.8 56 30 57.8 30 60 L 30 80 C 30 82.2 31.8 84 34 84 L 78 84 C 80.2 84 82 82.2 82 80 L 82 60 C 82 57.8 80.2 56 78 56 L 74 56 L 74 48 C 74 41 69 32 56 32 Z M 56 40 C 62 40 66 43.5 66 48 L 66 56 L 46 56 L 46 48 C 46 43.5 50 40 56 40 Z" fill="#ef4444" />
  </g>
</svg>
